apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif}</style><rect x="0.5" y="0.5" width="719" height="299" rx="10" class="bg frame"/><text x="16" y="28" class="t1" font-size="16" font-weight="600">같은 하루치 잡의 시간 분해: 노트북 vs Dataproc (2019-11-05)</text><text x="16" y="52" class="t2" font-size="12.5">Dataproc에서는 계산도 8~9배 느리지만, 잡마다 계산 밖의 시간이 38~50초씩 더</text><text x="16" y="70" class="t2" font-size="12.5">붙는다. 하루치가 작은 이 데이터에서는 클러스터의 고정 비용이 계산보다 크다</text><rect x="16" y="95" width="10" height="10" rx="2" class="s1f"/><text x="31.0" y="100.0" dy="0.35em" class="t2" font-size="12" font-weight="400" text-anchor="start">계산(Spark 단계 안)</text><rect x="164.4" y="95" width="10" height="10" rx="2" class="s2f"/><text x="179.4" y="100.0" dy="0.35em" class="t2" font-size="12" font-weight="400" text-anchor="start">드라이버 혼자(계획·파일 목록)</text><rect x="362.0" y="95" width="10" height="10" rx="2" class="s3f"/><text x="377.0" y="100.0" dy="0.35em" class="t2" font-size="12" font-weight="400" text-anchor="start">앱 바깥(시작·제출·대기)</text><line x1="132.0" y1="120.0" x2="132.0" y2="270.0" class="axis"/><text x="132.0" y="284.0" dy="0.35em" class="t3" font-size="11" font-weight="400" text-anchor="middle">0초</text><line x1="263.0" y1="120.0" x2="263.0" y2="270.0" class="grid"/><text x="263.0" y="284.0" dy="0.35em" class="t3" font-size="11" font-weight="400" text-anchor="middle">30초</text><line x1="394.0" y1="120.0" x2="394.0" y2="270.0" class="grid"/><text x="394.0" y="284.0" dy="0.35em" class="t3" font-size="11" font-weight="400" text-anchor="middle">60초</text><line x1="525.0" y1="120.0" x2="525.0" y2="270.0" class="grid"/><text x="525.0" y="284.0" dy="0.35em" class="t3" font-size="11" font-weight="400" text-anchor="middle">90초</text><line x1="656.0" y1="120.0" x2="656.0" y2="270.0" class="grid"/><text x="656.0" y="284.0" dy="0.35em" class="t3" font-size="11" font-weight="400" text-anchor="middle">120초</text><text x="122.0" y="138.8" dy="0.35em" class="t2" font-size="12" font-weigh