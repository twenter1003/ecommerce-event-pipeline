<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 474" role="img" aria-label="SCD2가 지킨 11월 매출 (상위 카테고리별, 로그 축)" font-family="system-ui, -apple-system, &quot;Apple SD Gothic Neo&quot;, &quot;Noto Sans KR&quot;, &quot;Segoe UI&quot;, sans-serif"><style>:root{--surface:#fcfcfb;--page:#f9f9f7;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--border:rgba(11,11,11,.10);--strong:#184f95;--soft:#86b6ef;--deemph:#c3c2b7;--critical:#d03b3b;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--on1:#0b0b0b;--on2:#0b0b0b;--on3:#0b0b0b;--q0:#86b6ef;--q1:#6da7ec;--q2:#5598e7;--q3:#3987e5;--q4:#2a78d6;--q5:#256abf;--q6:#1c5cab;--q7:#184f95;--q8:#104281;--q9:#0d366b;--qt0:#0b0b0b;--qt1:#0b0b0b;--qt2:#0b0b0b;--qt3:#0b0b0b;--qt4:#0b0b0b;--qt5:#ffffff;--qt6:#ffffff;--qt7:#ffffff;--qt8:#ffffff;--qt9:#ffffff}.bg{fill:var(--surface)}.frame{stroke:var(--border);stroke-width:1}.grid{stroke:var(--grid);stroke-width:1}.axis{stroke:var(--axis);stroke-width:1}.ref{stroke:var(--ink2);stroke-width:1}.t1{fill:var(--ink)}.t2{fill:var(--ink2)}.t3{fill:var(--muted)}.white{fill:#fff}.s1f{fill:var(--s1)}.s2f{fill:var(--s2)}.s3f{fill:var(--s3)}.s1a{fill:var(--s1);fill-opacity:.1}.on1{fill:var(--on1)}.on2{fill:var(--on2)}.on3{fill:var(--on3)}.strongf{fill:var(--strong)}.softf{fill:var(--soft)}.deemf{fill:var(--deemph)}.critf{fill:var(--critical)}.s1l,.s2l{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.s1l{stroke:var(--s1)}.s2l{stroke:var(--s2)}.ring{stroke:var(--surface);stroke-width:2}.link{stroke:var(--axis);stroke-width:2}.q0{fill:var(--q0)}.qt0{fill:var(--qt0)}.q1{fill:var(--q1)}.qt1{fill:var(--qt1)}.q2{fill:var(--q2)}.qt2{fill:var(--qt2)}.q3{fill:var(--q3)}.qt3{fill:var(--qt3)}.q4{fill:var(--q4)}.qt4{fill:var(--qt4)}.q5{fill:var(--q5)}.qt5{fill:var(--qt5)}.q6{fill:var(--q6)}.qt6{fill:var(--qt6)}.q7{fill:var(--q7)}.qt7{fill:var(--qt7)}.q8{fill:var(--q8)}.qt8{fill:var(--qt8)}.q9{fill:var(--q9)}.qt9{fill:var(--qt9)}text{font-family:system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif}</style><rect x="0.5" y="0.5" width="719" height="473" rx="10" class="bg frame"/><text x="16" y="28" class="t1" font-size="16" font-weight="600">SCD2가 지킨 11월 매출 (상위 카테고리별, 로그 축)</text><text x="16" y="52" class="t2" font-size="12.5">현재 카테고리로 덮어쓰면(Type-1) 11월 매출의 61%가 전자제품에서 &#x27;건설 공구&#x27;로 옮겨 간다.</text><text x="16" y="70" class="t2" font-size="12.5">원천이 12/1부터 카테고리를 다시 매겼기 때문이다. SCD2는 11월 구매를 11월의 카테고리로 센다</text><circle cx="117" cy="96" r="5" class="s1f"/><text x="127.0" y="96.0" dy="0.35em" class="t2" font-size="12" font-weight="400" text-anchor="start">11월 당시 카테고리(SCD2)</text><circle cx="293.6" cy="96" r="5" class="s2f"/><text x="303.6" y="96.0" dy="0.35em" class="t2" font-size="12" font-weight="400" text-anchor="start">현재 카테고리로 덮어씀(Type-1)</text><line x1="112.0" y1="116.0" x2="112.0" y2="444.0" class="grid"/><text x="112.0" y="458.0" dy="0.35em" class="t3" font-size="11" font-weight="400" text-anchor="middle">10만</text><line x1="254.0" y1="116.0" x2="254.0" y2="444.0" class="grid"/><text x="254.0" y="458.0" dy="0.35em" class="t3" font-size="11" font-weight="400" text-anchor="middle">100만</text><line x1="396.0" y1="116.0" x2="396.0" y2="444.0" class="grid"/><text x="396.0" y="458.0" dy="0.35em" class="t3" font-size="11" font-weight="400" text-anchor="middle">1,000만</text><line x1="538.0" y1="116.0" x2="538.0" y2="444.0" class="grid"/><text x="538.0" y="458.0" dy="0.35em" class="t3" font-size="11" font-weight="400" text-anchor="middle">1억</text><line x1="680.0" y1="116.0" x2="680.0" y2="444.0" class="grid"/><text x="680.0" y="458.0" dy="0.35em" class="t3" font-size="11" font-weight="400" text-anchor="middle">10억</text><text x="102.0" y="132.4" dy="0.35em" class="t2" font-size="12" font-weight="400" text-anchor="end">electronics</text><line x1="582.3" y1="132.4" x2="447.3" y2="132.4" class="link"/><circle cx="447.3" cy="132.4" r="4.5" class="s2f ring"/><circle cx="582.3" cy="132.4" r="4.5" class="s1f ring"/><text x="592.3" y="132.4" dy="0.35em" class="t1" font-size="12" font-weight="500" text-anchor="start">2.05억 → 2,298만</text><text x="102.0" y="165.2" dy="0.35em" class="t2" font-size="12" font-weight="400" text-anchor="end">construction</text><line x1="258.8" y1="165.2" x2="570.6" y2="165.2" class="link"/><circle cx="570.6" cy="165.2" r="4.5" class="s2f ring"/><circle cx="258.8" cy="165.2" r="4.5" class="s1f ring"/><text x="580.6" y="165.2" dy="0.35em" class="t1" font-size="12" font-weight="500" text-anchor="start">108만 → 1.70억</text><text x="102.0" y="198.0" dy="0.35em" class="t2" font-size="12" font-weight="400" text-anchor="end">appliances</text><line x1="434.4" y1="198.0" x2="480.9" y2="198.0" class="link"/><circle cx="480.9" cy="198.0" r="4.5" class="s2f ring"/><circle cx="434.4" cy="198.0" r="4.5" class="s1f ring"/><text x="102.0" y="230.8" dy="0.35em" class="t2" font-size="12" font-weight="400" text-anchor="end">(코드 없음)</text><line x1="463.5" y1="230.8" x2="403.6" y2="230.8" class="link"/><circle cx="403.6" cy="230.8" r="4.5" class="s2f ring"/><circle cx="463.5" cy="230.8" r="4.5" class="s1f ring"/><text x="102.0" y="263.6" dy="0.35em" class="t2" font-size="12" font-weight="400" text-anchor="end">computers</text><line x1="416.7" y1="263.6" x2="369.2" y2="263.6" class="link"/><circle cx="369.2" cy="263.6" r="4.5" class="s2f ring"/><circle cx="416.7" cy="263.6" r="4.5" class="s1f ring"/><text x="102.0" y="296.4" dy="0.35em" class="t2" font-size="12" font-weight="400" text-anchor="end">apparel</text><line x1="264.3" y1="296.4" x2="405.7" y2="296.4" class="link"/><circle cx="405.7" cy="296.4" r="4.5" class="s2f ring"/><circle cx="264.3" cy="296.4" r="4.5" class="s1f ring"/><text x="102.0" y="329.2" dy="0.35em" class="t2" font-size="12" font-weight="400" text-anchor="end">sport</text><line x1="196.8" y1="329.2" x2="373.8" y2="329.2" class="link"/><circle cx="373.8" cy="329.2" r="4.5" class="s2f ring"/><circle cx="196.8" cy="329.2" r="4.5" class="s1f ring"/><text x="102.0" y="362.0" dy="0.35em" class="t2" font-size="12" font-weight="400" text-anchor="end">furniture</text><line x1="311.6" y1="362.0" x2="336.3" y2="362.0" class="link"/><circle cx="336.3" cy="362.0" r="4.5" class="s2f ring"/><circle cx="311.6" cy="362.0" r="4.5" class="s1f ring"/><text x="102.0" y="394.8" dy="0.35em" class="t2" font-size="12" font-weight="400" text-anchor="end">kids</text><line x1="234.1" y1="394.8" x2="279.2" y2="394.8" class="link"/><circle cx="279.2" cy="394.8" r="4.5" class="s2f ring"/><circle cx="234.1" cy="394.8" r="4.5" class="s1f ring"/><text x="102.0" y="427.6" dy="0.35em" class="t2" font-size="12" font-weight="400" text-anchor="end">auto</text><line x1="273.6" y1="427.6" x2="220.0" y2="427.6" class="link"/><circle cx="220.0" cy="427.6" r="4.5" class="s2f ring"/><circle cx="273.6" cy="427.6" r="4.5" class="s1f ring"/></svg>