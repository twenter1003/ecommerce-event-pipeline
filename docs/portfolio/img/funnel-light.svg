othic Neo", "Noto Sans KR", "Segoe UI", sans-serif}</style><rect x="0.5" y="0.5" width="719" height="309" rx="10" class="bg frame"/><text x="16" y="28" class="t1" font-size="16" font-weight="600">10월의 함정과 기본 지표 고르기 (달별)</text><text x="16" y="52" class="t2" font-size="12.5">10월은 장바구니가 덜 기록돼 &#x27;구매 1건당 장바구니&#x27;가 1.2다(다른 달 2.5~3.0). 장바구니를 거치지 않는</text><text x="16" y="70" class="t2" font-size="12.5">세션 전환율은 10월도 다른 달과 비슷하다. 그래서 달끼리 비교하는 기본 지표를 세션 전환율로 정했다</text><line x1="56.0" y1="280.0" x2="336.0" y2="280.0" class="axis"/><text x="48.0" y="280.0" dy="0.35em" class="t3" font-size="11" font-weight="400" text-anchor="end">0</text><line x1="56.0" y1="198.0" x2="336.0" y2="198.0" class="grid"/><text x="48.0" y="198.0" dy="0.35em" class="t3" font-size="11" font-weight="400" text-anchor="end">2</text><line x1="56.0" y1="116.0" x2="336.0" y2="116.0" class="grid"/><text x="48.0" y="116.0" dy="0.35em" class="t3" font-size="11" font-weight="400" text-anchor="end">4</text><text x="56.0" y="96.0" dy="0.35em" class="t2" font-size="12" font-weight="600" text-anchor="start">구매 1건당 장바구니 담기</text><path d="M64.0,280.0V234.4Q64.0,230.4 68.0,230.4H84.0Q88.0,230.4 88.0,234.4V280.0Z" class="s1f"/><text x="76.0" y="220.4" dy="0.35em" class="t1" font-size="11" font-weight="600" text-anchor="middle">1.2</text><text x="76.0" y="294.0" dy="0.35em" class="t3" font-size="11" font-weight="400" text-anchor="middle">10월</text><path d="M104.0,280.0V173.9Q104.0,169.9 108.0,169.9H124.0Q128.0,169.9 128.0,173.9V280.0Z" class="deemf"/><text x="116.0" y="159.9" dy="0.35em" class="t2" font-size="11" font-weight="400" text-anchor="middle">2.7</text><text x="116.0" y="294.0" dy="0.35em" class="t3" font-size="11" font-weight="400" text-anchor="middle">11월</text><path d="M144.0,280.0V168.1Q144.0,164.1 148.0,164.1H164.0Q168.0,164.1 168.0,168.1V280.0Z" class="deemf"/><text x="156.0" y="154.1" dy="0.35em" class="t2" font-size="11" font-weight="400" text-anchor="middle">2.8</text><text x="156.0" y="294.0" dy="0.3