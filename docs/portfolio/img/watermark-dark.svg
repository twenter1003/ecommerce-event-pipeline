<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 316" role="img" aria-label="워터마크 5·10·20분 비교 (같은 재생: 5%는 0~8분, 0.5%는 15~20분 늦게 보냄)" font-family="system-ui, -apple-system, &quot;Apple SD Gothic Neo&quot;, &quot;Noto Sans KR&quot;, &quot;Segoe UI&quot;, sans-serif"><style>:root{--surface:#1a1a19;--page:#0d0d0d;--ink:#ffffff;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--border:rgba(255,255,255,.10);--strong:#9ec5f4;--soft:#256abf;--deemph:#52514e;--critical:#d03b3b;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--on1:#0b0b0b;--on2:#0b0b0b;--on3:#0b0b0b;--q0:#184f95;--q1:#1c5cab;--q2:#256abf;--q3:#2a78d6;--q4:#3987e5;--q5:#5598e7;--q6:#6da7ec;--q7:#86b6ef;--q8:#9ec5f4;--q9:#b7d3f6;--qt0:#ffffff;--qt1:#ffffff;--qt2:#ffffff;--qt3:#0b0b0b;--qt4:#0b0b0b;--qt5:#0b0b0b;--qt6:#0b0b0b;--qt7:#0b0b0b;--qt8:#0b0b0b;--qt9:#0b0b0b}.bg{fill:var(--surface)}.frame{stroke:var(--border);stroke-width:1}.grid{stroke:var(--grid);stroke-width:1}.axis{stroke:var(--axis);stroke-width:1}.ref{stroke:var(--ink2);stroke-width:1}.t1{fill:var(--ink)}.t2{fill:var(--ink2)}.t3{fill:var(--muted)}.white{fill:#fff}.s1f{fill:var(--s1)}.s2f{fill:var(--s2)}.s3f{fill:var(--s3)}.s1a{fill:var(--s1);fill-opacity:.1}.on1{fill:var(--on1)}.on2{fill:var(--on2)}.on3{fill:var(--on3)}.strongf{fill:var(--strong)}.softf{fill:var(--soft)}.deemf{fill:var(--deemph)}.critf{fill:var(--critical)}.s1l,.s2l{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.s1l{stroke:var(--s1)}.s2l{stroke:var(--s2)}.ring{stroke:var(--surface);stroke-width:2}.link{stroke:var(--axis);stroke-width:2}.q0{fill:var(--q0)}.qt0{fill:var(--qt0)}.q1{fill:var(--q1)}.qt1{fill:var(--qt1)}.q2{fill:var(--q2)}.qt2{fill:var(--qt2)}.q3{fill:var(--q3)}.qt3{fill:var(--qt3)}.q4{fill:var(--q4)}.qt4{fill:var(--qt4)}.q5{fill:var(--q5)}.qt5{fill:var(--qt5)}.q6{fill:var(--q6)}.qt6{fill:var(--qt6)}.q7{fill:var(--q7)}.qt7{fill:var(--qt7)}.q8{fill:var(--q8)}.qt8{fill:var(--qt8)}.q9{fill:var(--q9)}.qt9{fill:var(--qt9)}text{font-family:system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif}</style><rect x="0.5" y="0.5" width="719" height="315" rx="10" class="bg frame"/><text x="16" y="28" class="t1" font-size="16" font-weight="600">워터마크 5·10·20분 비교 (같은 재생: 5%는 0~8분, 0.5%는 15~20분 늦게 보냄)</text><text x="16" y="52" class="t2" font-size="12.5">길게 잡을수록 덜 버리지만 윈도를 상태에 더 오래 들고 있다. 그만큼 결과도 늦게 확정된다.</text><text x="16" y="70" class="t2" font-size="12.5">워터마크보다 늦은 이벤트가 모두 버려지지는 않는다(Spark는 한 배치 전 워터마크로 거른다)</text><rect x="64" y="93" width="10" height="10" rx="2" class="softf"/><text x="79.0" y="98.0" dy="0.35em" class="t2" font-size="12" font-weight="400" text-anchor="start">워터마크보다 늦게 보낸 이벤트</text><rect x="259.20000000000005" y="93" width="10" height="10" rx="2" class="strongf"/><text x="274.2" y="98.0" dy="0.35em" class="t2" font-size="12" font-weight="400" text-anchor="start">실제로 버려진 이벤트</text><text x="64.0" y="122.0" dy="0.35em" class="t2" font-size="12" font-weight="600" text-anchor="start">이벤트 수</text><line x1="64.0" y1="286.0" x2="336.0" y2="286.0" class="axis"/><text x="56.0" y="286.0" dy="0.35em" class="t3" font-size="11" font-weight="400" text-anchor="end">0</text><line x1="64.0" y1="212.0" x2="336.0" y2="212.0" class="grid"/><text x="56.0" y="212.0" dy="0.35em" class="t3" font-size="11" font-weight="400" text-anchor="end">1만</text><line x1="64.0" y1="138.0" x2="336.0" y2="138.0" class="grid"/><text x="56.0" y="138.0" dy="0.35em" class="t3" font-size="11" font-weight="400" text-anchor="end">2만</text><path d="M86.3,286.0V157.3Q86.3,153.3 90.3,153.3H104.3Q108.3,153.3 108.3,157.3V286.0Z" class="softf"/><path d="M110.3,286.0V263.8Q110.3,259.8 114.3,259.8H128.3Q132.3,259.8 132.3,263.8V286.0Z" class="strongf"/><text x="97.3" y="143.3" dy="0.35em" class="t2" font-size="11" font-weight="400" text-anchor="middle">17,929</text><text x="136.3" y="259.8" dy="0.35em" class="t1" font-size="11" font-weight="600" text-anchor="start">3,543</text><text x="109.3" y="300.0" dy="0.35em" class